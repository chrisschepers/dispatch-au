name: Official source contracts
on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: dispatch-source-contracts
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: node --experimental-strip-types scripts/check-live-sources.mjs
        env:
          NOTIFY_GITHUB: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-contracts
          path: monitor-output/
          retention-days: 14
          if-no-files-found: error
